name: Import customer-owned Crescent AR model
on:
  push:
    branches:
      - feature/crescent-ar-3d-real-model-nov2026
    paths:
      - .github/workflows/import-crescent-ar.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/crescent-ar-3d-real-model-nov2026
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow to optimize model textures
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Import and validate original customer PBR model
        run: |
          python tools/import_crescent_ar_asset.py \
            --source 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JFYfMhlaETVUS2PtjJS5nwqAH6/921dee81-9c94-4bde-912f-bcc35492eec5.zip' \
            --output 'assets/models/crescent-reference-ar.glb'
          python - <<'PY'
          import struct, pathlib
          p=pathlib.Path('assets/models/crescent-reference-ar.glb')
          b=p.read_bytes()
          magic,version,byte_length=struct.unpack_from('<4sII',b)
          assert magic==b'glTF' and version==2 and len(b)==byte_length
          assert p.stat().st_size < 10_000_000
          print('Validated real model,',p.stat().st_size,'bytes')
          PY
      - name: Commit model to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/crescent-reference-ar.glb
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized real Crescent bag model for 3D and AR"
            git push origin HEAD:feature/crescent-ar-3d-real-model-nov2026
          fi
